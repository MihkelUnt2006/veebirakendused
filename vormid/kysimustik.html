<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
    <link rel="stylesheet" href="vormStyle.css">
    <script src="../js/kysimustikScript.js"></script>
</head>
<body>
<h1>Muusika küsimustik</h1>
<div>HTML vormid ja nupud</div>
<form action="#">
    <!-- c + tab = kometaar -->
    <table>
        <tr>
            <td>
                <!-- Tekstkast -->
                <label for="nimi">Nimi: </label>
            </td>
            <td>
                <input type="text" id="nimi" placeholder="Mihkel" oninput="nimiLugemineKastist()">

            </td>
            <td>
                <div id="vastus1"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="stiil">Vali meeldivaim muusikastiil</label>
            </td>
            <td>
                <!-- ripploend või rippmenüü (drop down list)-->
                <select name="stiil" id="stiil" onchange="selectValik()">
                    <option value="vali">vali..</option>
                    <option value="hiphop">hiphop</option>
                    <option value="rock">rock</option>
                    <option value="kantri">kantri</option>
                    <option value="metal">metal</option>
                    <option value="jazz">jazz</option>
                </select>
            </td>
            <td>
                <div id="vastus5"></div>
            </td>
        </tr>
        <tr>
            <td>
                <strong>kuidas sa muusikat peamiselt kuulad?</strong>
            </td>
            <td>
                <!-- radio nupud - 1 valik mitmest-->
                <br>
                <input type="radio" name="platvorm" id="spotify" value="Spotify" onclick="radiovalik()">
                <label for="spotify">spotify</label>
                <br>
                <input type="radio" name="platvorm" id="soundcloud" value="soundcloud" onclick="radiovalik()">
                <label for="soundcloud">soundcloud</label>
            </td>
            <td>
                <div id="vastus2"></div>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <!-- checkbox -->
                <!-- checkbox markerruut -->
                <fieldset>
                    <legend>Tee oma valikud - lemmik ansambe</legend>
                    <input type="checkbox" name = "lemmikud" id="Oasis" value="Oasis" onchange="checkboxvalik()">
                    <label for="Oasis">Oasis</label>
                    <br>
                    <input type="checkbox" name = "lemmikud" id="Radiohead" value ="Radiohead" onchange="checkboxvalik()">
                    <label for="Radiohead">Radiohead</label>
                    <br>
                    <input type="checkbox" name = "lemmikud" id="RHCP" value="Red Hot Chili Peppers" onchange="checkboxvalik()">
                    <label for="RHCP">RHCP</label>
                    <br>
                    <input type="checkbox" name = "lemmikud" id="AC-DC" value="AC DC" onchange="checkboxvalik()">
                    <label for="AC-DC">AC-DC</label>

                </fieldset>
            </td>
            <td>
                <div id="vastus3"></div>
            </td>
        </tr>
        <tr>
            <td>
                <!-- range - vahemik -->
                <label for="tund">
                    Mitu tundi päevas sa kuulad muuskat?
                </label>
            </td>
            <td>
                0<input type="range" id="tund" min="0" max="24" oninput="rangeValik()">
            </td>
            <td>
                <div id="vastus4"></div>
            </td>
        </tr>
        <tr>
            <td>  <label for="phone">Enter your phone number:</label>
            </td>
            <td> <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}"  placeholder="+37212345678"></td>
        </tr>
        <tr>
            <td>

                <label for="email">Enter your email:</label>
            </td>
            <td>
                <input type="email" id="email" name="email" placeholder="naidis@gmail.com">
            </td>
        <tr>
            <td>
                <label for="myfile">Vali oma lemmikmuusika:</label>

            </td>
            <td>
                <input type="file" id="myfile" name="myfile">
            </td>
        </tr>
        <tr>
            <td>

                <label for="favcolor">Vali värv millega sa seosed sinu lemmikmuusika</label>

            </td>
            <td>
                <input type="color" id="favcolor" name="favcolor">
            </td>
        <tr>
            <td>
                <label for="kuupaev">Millal sa eelmisel kord kuulasid muusikat?</label>

            </td>
            <td>
                <input type="date" id="kuupaev" name="kuupaev">
            </td>
        </tr>

        <tr>
            <td><input type="reset" value="Reset"></td>
            <td> <input type="submit" value="Submit"></td>
        </tr>
        <tr>
        <td>
        <input type="reset" value="Puhasta" onclick="puhasta()">
        </td>
        <td> <input type="button" value="Näita/Lo andmed" onclick="naitaKoike()">
        </td>
        <td>
        <div id="vastusKoik"></div>
        </td>
        </tr>
     <tr>
         <td>
            <label  for="arvamus" >Mida arvad muusika kuulamisest koolis?</label>
         </td>
         <td>
             <textarea name= "arvamus" id="arvamus" cols="30" rows="10" oninput="arvamusLugeminde()"></textarea>
         </td>
         <td>
             <div id="vastus6"></div>
         </td>
     </tr>

        <tr>
            <td>
                <strong kas sa kuulad raadiot></strong>
            </td>
            <td>
                <input type="radio" name = "raadioValik" id="Jah" value="Jah" onclick="raadioValik2()">
                <label for="Jah">Jah</label><br>
                <input type="radio" name = "raadioValik" id="Ei" value="Ei" onclick="raadioValik2()">
                <label for="Ei">Ei</label><br>

            </td>
            <td>
                <div id="vastus7"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="raadiojaam">Millised raadiojaamu oskad nimetada</label>
            </td>
            <td>
                <input type="text" name="raadiojaam" id="raadiojaam" placeholder="skyRaadio" oninput="raadiojaamvalik()">
            </td>
            <td>
                <div id="vastus8"></div>
            </td>
        </tr>

    </table>

</form>
</body>
