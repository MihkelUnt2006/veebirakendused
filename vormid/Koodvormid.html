<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<title>Programmeerimise küsimustik</title>
<link rel="stylesheet" href="Koodvormstyle.css">
    <script src=../js/Koodvorm.js></script>
</head>
<body>
<h1>Programmeerimise küsimustik</h1>
<form action="#">
 <table>
<tr>
    <th>Küsimus</th>
    <th>Vastus</th>
</tr>
<tr>
<td>Milliseid programmeerimiskeeli sa tead?</td>
<td>
<input type="checkbox" name="keeled" id="js" value="JavaScript" onchange="keeledValik()">
  <label for="js">JavaScript</label>
   <br>
   <input type="checkbox" name="keeled" id="python" value="Python" onchange="keeledValik()">
   <label for="python">Python</label>
    <br>
    <input type="checkbox" name="keeled" id="java" value="Java" onchange="keeledValik()">
     <label for="java">Java</label>
      <br>
    <input type="checkbox" name="keeled" id="csharp" value="C#" onchange="keeledValik()">
      <label for="csharp">C#</label>
      <br>
      <input type="checkbox" name="keeled" id="php" value="PHP" onchange="keeledValik()">
      <label for="php">PHP</label>
       <br>
        <div id="vastus1"></div>
</td>
</tr>
<tr>
 <td><label for="arvamus">Mida arvad programmeerimise õppimisest?</label></td>
<td>
   <textarea name="arvamus" id="arvamus" cols="30" rows="10" oninput="arvamusLugemine()"></textarea>
    <div id="vastus2"></div>
</td>
</tr>
<tr>
  <td><label for="tunnid">Mitu tundi nädalas tegeled programmeerimisega?</label></td>
  <td>
  0 <input type="range" id="tunnid" name="tunnid" min="0" max="80" value="0" oninput="tunnidValik()"> 80
  <div id="vastus3"></div>
   </td>
   </tr>
   <tr>
   <td>Kas sulle meeldib programmeerida?</td>
            <td>
                <input type="radio" name="meeldib" id="jah" value="Jah" onclick="meeldibValik()">
                <label for="jah">Jah</label>
                <input type="radio" name="meeldib" id="ei" value="Ei" onclick="meeldibValik()">
                <label for="ei">Ei</label>
                <div id="vastus4"></div>
                <img src="" alt="" id="smiley">
            </td>
 </tr>
 <tr>
   <td><label for="tooriistad">Milliseid programmeerimisega seotud tööriistu oskad nimetada?</label></td>
   <td>
   <input type="text" id="tooriistad" name="tooriistad" placeholder="Visual Studio Code, GitHub, PhpStorm" oninput="tooriistadLugemine()">
   <div id="vastus5"></div>
   </td>
 </tr>
 <tr>
   <td><label for="soov">Millist programmeerimiskeelt sooviksid kõige rohkem õppida?</label></td>
    <td>
   <select name="soov" id="soov" onchange="soovValik()">

     <option value="vali">vali...</option>

     <option value="Rust">Rust</option>
     <option value="Go">Go</option>
     <option value="Kotlin">Kotlin</option>
     <option value="Swift">Swift</option>
     <option value="TypeScript">TypeScript</option>
      <option value="C++">C++</option>

    </select>
    <div id="vastus6"></div>
  </td>
  </tr>
   <tr>
   <td colspan="2">
   <input type="button" value="Saada" onclick="saada()">
   <input type="button" value="Puhasta" onclick="puhasta()">
    </td>
    </tr>
    </table>
</form>
<div id="vastusKoik"></div>
</body>
</html>
