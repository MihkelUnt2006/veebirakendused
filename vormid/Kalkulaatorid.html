<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Kalkulaatorid</title>
  <link rel="stylesheet" href="kalkStyle.css">
  <script src="../js/kalk1Script.js"></script>
  <script src="../js/kalk2Script.js"></script>
  <script src="../js/kalk3Script.js"></script>
</head>
<body>
<h1>Kalkulaatorid</h1>
<section id="yld">
  <!-- css paigutus flex row -->
  <section id="kalk1">
    <h2>Meetri/tolli kalkulaator</h2>
    <br>
    <label for="arv"> Sisesta arv</label>
    <input type="number" id="arv" min="1" max="100" step="1" value="10" onchange="teisendamine()">
    <br>
    <input type="radio" name="valik" id="meeter" value="meeter" onchange="teisendamine()">
    <label for="meeter">Meeter</label>
    <br>
    <input type="radio" name="valik" id="tolli" value="tolli" onchange="teisendamine()">
    <label for="tolli">Toll</label>
    <br>
    <div id="vastus"></div>
    <img src="" alt="" id="vastusepilt">

  </section>
  <section id="kalk2">
    <h2>Joogi kalkulaator</h2>

    <label for="kogus">Mitu tk soovid: </label>
    <input type="number" id="kogus" min="1" max="100" step="1" value="1">
    <label for="joogivalik"> Vali lemmikjook: </label>
    <select name="joogivalik" id="joogivalik" onchange="Jookidevalik()">
      <option value="">vali</option>
      <option value="kohv">Kohv</option>
      <option value="vesi">Vesi</option>
      <option value="coca">Coca-Cola</option>
      <option value="fanta">Fanta</option>
    </select>
    <br>
    <div id="vastus2"></div>
</section>

  <section id="kalk3">
    <h2>Ühikute teisendaja</h2>
    <br>
    <label for="kogus3">Sisesta arv:</label>
    <input type="number" id="kogus3" value="1" onchange="teisendaYhik()">
    <br><br>

    <input type="radio" name="yhik" id="km_miil" value="km" onchange="teisendaYhik()">
    <label for="km_miil">km → miilid</label>
    <br>
    <input type="radio" name="yhik" id="kg_nael" value="kg" onchange="teisendaYhik()">
    <label for="kg_nael">kg → naelad</label>
    <br>
    <input type="radio" name="yhik" id="c_f" value="c" onchange="teisendaYhik()">
    <label for="c_f">°C → °F</label>
    <br>

    <div id="vastus3"></div>
    <img src="" alt="" id="vastusepilt3">
  </section>
</section>

</body>
</html>
