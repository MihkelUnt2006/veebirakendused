<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Tabel</title>
  <link rel="stylesheet" href="TabeliYlesanneStyle.css">
</head>
<body>

<h1>Tabel</h1>

<table id="Tabel">
  <tr>
    <td rowspan="4" style="background-color: forestgreen">1</td>
    <td style="background-color: orangered">2</td>
    <td colspan="2" style="background-color: fuchsia">3</td>
  </tr>
  <tr>
    <td style="background-color: olivedrab">4</td>
    <td colspan="2" style="background-color: gold">5</td>
  </tr>
  <tr>
    <td style="background-color: brown">6</td>
    <td style="background-color: crimson">7</td>
    <td style="background-color: coral">8</td>
  </tr>
  <tr>
    <td style="background-color: chartreuse">11</td>
    <td style="background-color: seagreen">9</td>
    <td style="background-color: palevioletred" >10</td>
  </tr>
</table>
</body>
</html>
